name: Site CI

# Reusable CI for every lvucodes.github.io site. Consumers invoke it from a
# thin workflow:
#
#   jobs:
#     site-ci:
#       uses: lvuCodes/terminal-themes/.github/workflows/site-ci.yml@main
#
# Expects the repo to define `npm run verify` (the full local gate set) and
# `npm run smoke` (the Playwright iPhone SE suite, building the site first).
#
# Jobs skip on draft PRs, and on a Dependabot PR's opening event since
# dependabot-draft.yml converts it to a draft. Consumers add `ready_for_review`
# to their `pull_request` types so CI runs once a PR is marked ready.

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: "22"

jobs:
  verify:
    if: >-
      github.event_name != 'pull_request' ||
      (!github.event.pull_request.draft &&
       !(github.event.pull_request.user.login == 'dependabot[bot]' &&
         contains(fromJSON('["opened", "reopened"]'), github.event.action)))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run verify

  se-smoke:
    if: >-
      github.event_name != 'pull_request' ||
      (!github.event.pull_request.draft &&
       !(github.event.pull_request.user.login == 'dependabot[bot]' &&
         contains(fromJSON('["opened", "reopened"]'), github.event.action)))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run smoke
