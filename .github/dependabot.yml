version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    groups:
      react:
        patterns:
          - react
          - react-dom
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
